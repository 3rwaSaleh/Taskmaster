<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدير المهام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f7;
  --surface: #ffffff;
  --surface2: #f7f8fc;
  --surface3: #eef0f8;
  --border: #e4e8f0;
  --text: #1a1d2e;
  --text2: #5a6080;
  --text3: #9aa0be;
  --accent: #5b5ef4;
  --accent2: #7c3aed;
  --shadow: 0 4px 24px rgba(91,94,244,0.10);
  --shadow2: 0 2px 12px rgba(0,0,0,0.07);
  --radius: 18px;
  --radius-sm: 10px;
  --critical: #f43f5e;
  --high: #f97316;
  --medium: #eab308;
  --low: #10b981;
}
[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #1a1d2e;
  --surface2: #20243a;
  --surface3: #272b42;
  --border: #2e3352;
  --text: #e8eaf5;
  --text2: #8b91b3;
  --text3: #4a5075;
  --accent: #6c6ff5;
  --accent2: #8b5cf6;
  --shadow: 0 4px 24px rgba(0,0,0,0.35);
  --shadow2: 0 2px 12px rgba(0,0,0,0.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
}
/* SCROLLBAR */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* ── LAYOUT ─────────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; max-width: 480px; margin: 0 auto; position: relative; }

/* ── HEADER ─────────────────────────────────────────────────── */
.header {
  background: linear-gradient(145deg, var(--accent) 0%, var(--accent2) 100%);
  padding: 20px 20px 0;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -40px; left: -40px;
  width: 180px; height: 180px;
  background: rgba(255,255,255,0.07);
  border-radius: 50%;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 10px; right: -30px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
}
.header-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
.app-title { color: #fff; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
.app-subtitle { color: rgba(255,255,255,0.65); font-size: 12px; margin-top: 2px; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px;
  background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.25);
  color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all .2s; backdrop-filter: blur(4px);
}
.icon-btn:hover { background: rgba(255,255,255,0.28); transform: scale(1.05); }

/* Progress */
.progress-area { padding: 14px 0 0; position: relative; z-index: 1; }
.progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.progress-label { color: rgba(255,255,255,0.75); font-size: 12px; }
.progress-pct { color: #fff; font-size: 13px; font-weight: 800; }
.progress-bar { height: 6px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
.progress-fill { height: 100%; background: rgba(255,255,255,0.85); border-radius: 10px; transition: width .5s cubic-bezier(.34,1.56,.64,1); }

/* Tabs */
.tabs { display: flex; gap: 3px; background: rgba(0,0,0,0.15); border-radius: 14px; padding: 4px; margin: 14px 0 0; position: relative; z-index: 1; }
.tab {
  flex: 1; padding: 9px 4px; border: none; background: transparent; color: rgba(255,255,255,0.65);
  border-radius: 10px; cursor: pointer; font-family: 'Cairo',sans-serif; font-size: 13px; font-weight: 600;
  transition: all .25s; display: flex; align-items: center; justify-content: center; gap: 5px;
}
.tab.active { background: #fff; color: var(--accent); box-shadow: 0 2px 12px rgba(0,0,0,0.15); }

/* Date nav */
.date-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px; background: var(--surface);
  border-bottom: 1.5px solid var(--border);
}
.date-nav-btn {
  width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; transition: all .2s;
}
.date-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.date-label { font-size: 14px; font-weight: 700; color: var(--text); }
.today-btn {
  font-size: 11px; padding: 4px 12px; border-radius: 20px; border: none;
  background: var(--surface3); color: var(--accent); cursor: pointer; font-family:'Cairo',sans-serif; font-weight:700;
}

/* ── CONTENT ────────────────────────────────────────────────── */
.content { flex: 1; overflow-y: auto; padding: 16px 20px 100px; background: var(--bg); }

/* Priority section */
.priority-section { margin-bottom: 20px; animation: fadeUp .3s ease; }
.priority-header {
  display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-radius: 12px; margin-bottom: 10px; cursor: pointer; user-select: none;
}
.priority-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.priority-name { font-size: 13px; font-weight: 800; flex: 1; }
.priority-count {
  font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 20px;
  background: rgba(255,255,255,0.85); color: inherit;
}

/* Task Card */
.task-card {
  display: flex; align-items: flex-start; gap: 11px; padding: 13px 14px;
  border-radius: 15px; margin-bottom: 8px; background: var(--surface);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow2);
  transition: all .25s; position: relative; overflow: hidden;
  animation: fadeUp .25s ease;
}
.task-card::before {
  content: ''; position: absolute; right: 0; top: 0; bottom: 0;
  width: 4px; border-radius: 0 4px 4px 0;
}
.task-card.done { opacity: 0.55; }
.task-card.done .task-title { text-decoration: line-through; color: var(--text3); }

.check-btn {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
  border: 2px solid var(--border); background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
  transition: all .2s; color: #fff; font-weight: 800;
}
.check-btn.checked { border-color: transparent !important; }

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 14px; font-weight: 700; color: var(--text); word-break: break-word; line-height: 1.4; }
.task-meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.tag {
  font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  display: inline-flex; align-items: center; gap: 3px;
}
.task-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.task-act-btn {
  width: 28px; height: 28px; border-radius: 8px; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all .2s;
}
.task-act-btn.edit { background: var(--surface3); color: var(--text2); }
.task-act-btn.del { background: #fef2f2; color: #ef4444; }
[data-theme="dark"] .task-act-btn.del { background: #2a1a1a; }

/* Empty state */
.empty-state {
  text-align: center; padding: 56px 20px;
  background: var(--surface); border-radius: 20px; border: 2px dashed var(--border);
}
.empty-icon { font-size: 52px; margin-bottom: 14px; }
.empty-title { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.empty-sub { font-size: 13px; color: var(--text3); }

/* Done section */
.done-section { margin-top: 8px; }
.done-toggle {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--surface3); border-radius: 12px; cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--text2); border: none;
  width: 100%; margin-bottom: 8px; font-family:'Cairo',sans-serif; transition:.2s;
}
.done-toggle:hover { color: var(--text); }

/* ── PROFILE TABS ───────────────────────────────────────────── */
.profile-strip {
  display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px 0;
  background: var(--surface); scrollbar-width: none;
}
.profile-strip::-webkit-scrollbar { display: none; }
.profile-chip {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 12px;
  font-weight: 700; cursor: pointer; border: 2px solid var(--border);
  background: var(--surface2); color: var(--text2); font-family:'Cairo',sans-serif;
  transition: all .2s; white-space: nowrap; display: flex; align-items: center; gap: 5px;
}
.profile-chip.active { border-color: var(--accent); background: var(--accent); color: #fff; }

/* ── FAB ────────────────────────────────────────────────────── */
.fab {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; border-radius: 24px; padding: 15px 36px;
  color: #fff; font-weight: 900; font-size: 16px; font-family:'Cairo',sans-serif;
  cursor: pointer; box-shadow: 0 8px 32px rgba(91,94,244,0.45);
  display: flex; align-items: center; gap: 8px; z-index: 200;
  transition: all .25s; white-space: nowrap;
}
.fab:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 12px 40px rgba(91,94,244,0.55); }
.fab:active { transform: translateX(-50%) scale(0.97); }

/* ── MODAL ──────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 500; display: flex; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(5px); animation: fadeIn .2s;
}
.modal {
  background: var(--surface); border-radius: 28px 28px 0 0;
  width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
  animation: slideUp .3s cubic-bezier(.34,1.56,.64,1);
  padding: 0 0 40px;
}
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 10px; margin: 14px auto 0; }
.modal-header { padding: 16px 24px 14px; border-bottom: 1.5px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-title { font-size: 18px; font-weight: 800; color: var(--text); }
.modal-close { width:32px;height:32px;border-radius:10px;background:var(--surface3);border:none;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:.2s; }
.modal-close:hover { color:var(--text); }
.modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

/* Form */
.form-label { font-size: 12px; font-weight: 800; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; display: block; }
.form-input {
  width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--surface2); color: var(--text); font-family:'Cairo',sans-serif; font-size: 14px;
  outline: none; transition: border-color .2s;
}
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--text3); }
.form-textarea { resize: vertical; min-height: 72px; }
.chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  padding: 7px 14px; border-radius: 20px; border: 2px solid var(--border);
  background: var(--surface2); color: var(--text2); cursor: pointer;
  font-size: 12px; font-weight: 700; font-family:'Cairo',sans-serif; transition: all .2s;
  display: flex; align-items: center; gap: 5px;
}
.chip.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.chip.priority { flex: 1; justify-content: center; padding: 8px 4px; }
.color-dots { display: flex; gap: 8px; flex-wrap: wrap; }
.color-dot {
  width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent;
  cursor: pointer; transition: all .2s; outline: none;
}
.color-dot.selected { transform: scale(1.2); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px currentColor; }
.form-row { display: flex; gap: 10px; }
.form-row > * { flex: 1; }
.save-btn {
  width: 100%; padding: 15px; border-radius: 14px; border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; font-weight: 900; font-size: 16px; font-family:'Cairo',sans-serif;
  cursor: pointer; box-shadow: 0 4px 20px rgba(91,94,244,0.35); margin-top: 4px;
  transition: all .2s;
}
.save-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(91,94,244,0.45); }
.cancel-btn {
  width: 100%; padding: 13px; border-radius: 14px; border: 2px solid var(--border);
  background: var(--surface2); color: var(--text2); font-weight: 700; font-size: 15px;
  font-family:'Cairo',sans-serif; cursor: pointer; transition: all .2s;
}
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--surface2); border-radius: 12px; }
.toggle-label { font-size: 14px; font-weight: 700; color: var(--text); }
.toggle-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.switch { position: relative; width: 48px; height: 27px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--border); border-radius: 27px; cursor: pointer; transition: .3s; }
.slider:before { content: ''; position: absolute; height: 21px; width: 21px; right: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .3s; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
input:checked + .slider { background: var(--accent); }
input:checked + .slider:before { transform: translateX(-21px); }

/* Notification permission banner */
.notif-banner {
  display: flex; gap: 10px; align-items: center; padding: 10px 14px;
  background: linear-gradient(135deg,#fef3c7,#fff7e6); border-radius: 12px; border: 1.5px solid #fde68a;
  font-size: 12px; font-weight: 600; color: #92400e; cursor: pointer; transition: .2s;
}
[data-theme="dark"] .notif-banner { background: #2a2010; border-color: #78350f; color: #fcd34d; }

/* Animations */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HEADER -->
  <div class="header" id="header">
    <div class="header-top">
      <div>
        <div class="app-title">🗂 مدير المهام</div>
        <div class="app-subtitle" id="headerDate">اليوم</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openProfilesModal()" title="الأشخاص">👥</button>
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="تغيير المظهر">🌙</button>
      </div>
    </div>
    <div class="progress-area">
      <div class="progress-row">
        <span class="progress-label" id="progressLabel">0 مهام متبقية</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="tabs" style="margin-bottom:14px">
      <button class="tab active" onclick="setView('daily')" id="tab-daily">📅 اليوم</button>
      <button class="tab" onclick="setView('weekly')" id="tab-weekly">📆 الأسبوع</button>
      <button class="tab" onclick="setView('monthly')" id="tab-monthly">🗓 الشهر</button>
    </div>
  </div>

  <!-- DATE NAV -->
  <div class="date-nav" id="dateNav" style="display:none">
    <button class="date-nav-btn" onclick="navDate(-1)">›</button>
    <div style="text-align:center">
      <div class="date-label" id="dateLabel">—</div>
    </div>
    <button class="date-nav-btn" onclick="navDate(1)">‹</button>
  </div>

  <!-- PROFILE STRIP -->
  <div class="profile-strip" id="profileStrip"></div>

  <!-- CONTENT -->
  <div class="content" id="content"></div>

  <!-- FAB -->
  <button class="fab" onclick="openAddModal()">＋ مهمة جديدة</button>
</div>

<!-- TASK MODAL -->
<div class="overlay" id="taskModal" style="display:none" onclick="closeModalOnBg(event,'taskModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">مهمة جديدة</span>
      <button class="modal-close" onclick="closeModal('taskModal')">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- PROFILES MODAL -->
<div class="overlay" id="profilesModal" style="display:none" onclick="closeModalOnBg(event,'profilesModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">إدارة الأشخاص</span>
      <button class="modal-close" onclick="closeModal('profilesModal')">✕</button>
    </div>
    <div class="modal-body" id="profilesModalBody"></div>
  </div>
</div>

<script>
// ═══════════════════════════════ DATA ════════════════════════════════
const DAYS_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const PRIORITY = {
  critical: { label:'أساسي', color:'#f43f5e', bg:'rgba(244,63,94,0.12)', icon:'🔴' },
  high:     { label:'مهم',   color:'#f97316', bg:'rgba(249,115,22,0.12)', icon:'🟠' },
  medium:   { label:'متوسط', color:'#eab308', bg:'rgba(234,179,8,0.12)',  icon:'🟡' },
  low:      { label:'جانبي', color:'#10b981', bg:'rgba(16,185,129,0.12)', icon:'🟢' },
};
const COLORS = ['#f43f5e','#f97316','#eab308','#10b981','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#6366f1','#14b8a6'];
const TYPE_LABELS = { once:'مرة واحدة', daily:'يومية', weekly:'أسبوعية', monthly:'شهرية' };

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function today() { const d=new Date(); d.setHours(0,0,0,0); return d; }
function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function sameDay(a,b) { const x=new Date(a),y=new Date(b); return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate(); }

// ═══════════════════════════════ STATE ═══════════════════════════════
let state = {
  tasks: [],
  profiles: [{id:'me',name:'أنا',emoji:'👤',color:'#6366f1'}],
  view: 'daily',
  currentDate: fmtDate(today()),
  activeProfile: 'all',
  theme: 'light',
  showDone: false,
};

function loadState() {
  try {
    const s = localStorage.getItem('tm2_state');
    if (s) {
      const parsed = JSON.parse(s);
      state = { ...state, ...parsed };
    }
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('tm2_state', JSON.stringify(state));
}

// ══════════════════════════ RECURRING DONE ═══════════════════════════
// Key = taskId + "_" + periodKey  (e.g. "abc_2025-05" for monthly)
function getPeriodKey(task, dateObj) {
  if (task.recurType === 'once') return 'once';
  if (task.recurType === 'daily') return fmtDate(dateObj);
  if (task.recurType === 'weekly') {
    // week start Sunday
    const d = new Date(dateObj);
    d.setDate(d.getDate() - d.getDay());
    return fmtDate(d);
  }
  if (task.recurType === 'monthly') {
    return `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}`;
  }
  return fmtDate(dateObj);
}

function isDoneInPeriod(task, dateObj) {
  const key = task.id + '_' + getPeriodKey(task, dateObj);
  return !!(state.doneLog || {})[key];
}

function toggleDoneInPeriod(task, dateObj) {
  if (!state.doneLog) state.doneLog = {};
  const key = task.id + '_' + getPeriodKey(task, dateObj);
  if (state.doneLog[key]) delete state.doneLog[key];
  else state.doneLog[key] = true;
  saveState();
  render();
}

// ═══════════════════════════════ FILTER ══════════════════════════════
function getVisibleTasks() {
  const dateObj = new Date(state.currentDate + 'T00:00:00');
  let tasks = state.tasks;

  if (state.activeProfile !== 'all')
    tasks = tasks.filter(t => t.profileId === state.activeProfile);

  if (state.view === 'daily') {
    tasks = tasks.filter(t => {
      if (t.recurType === 'once') return sameDay(t.date, dateObj);
      if (t.recurType === 'daily') return true;
      if (t.recurType === 'weekly') return t.weekDay === dateObj.getDay();
      if (t.recurType === 'monthly') return t.monthDay === dateObj.getDate();
      return false;
    });
  } else if (state.view === 'weekly') {
    const weekStart = new Date(dateObj);
    weekStart.setDate(dateObj.getDate() - dateObj.getDay());
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    tasks = tasks.filter(t => {
      if (t.recurType === 'once') {
        const d = new Date(t.date+'T00:00:00');
        return d >= weekStart && d <= weekEnd;
      }
      if (t.recurType === 'daily') return true;
      if (t.recurType === 'weekly') return true;
      if (t.recurType === 'monthly') {
        for (let i=0;i<7;i++) { const d=new Date(weekStart); d.setDate(weekStart.getDate()+i); if(d.getDate()===t.monthDay) return true; }
        return false;
      }
      return false;
    });
  } else { // monthly
    tasks = tasks.filter(t => {
      if (t.recurType === 'once') {
        const d = new Date(t.date+'T00:00:00');
        return d.getMonth()===dateObj.getMonth() && d.getFullYear()===dateObj.getFullYear();
      }
      return true; // daily/weekly/monthly all appear in month view
    });
  }

  return tasks;
}

// ═══════════════════════════════ THEME ═══════════════════════════════
function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  applyTheme();
  saveState();
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeBtn').textContent = state.theme === 'dark' ? '☀️' : '🌙';
}

// ═══════════════════════════════ DATES ═══════════════════════════════
const VIEWS_CONFIG = {
  daily:   { label: d => `${DAYS_AR[d.getDay()]}، ${d.getDate()} ${MONTHS_AR[d.getMonth()]}`, step: d => { d.setDate(d.getDate()+1); } },
  weekly:  { label: d => { const s=new Date(d); s.setDate(d.getDate()-d.getDay()); const e=new Date(s); e.setDate(s.getDate()+6); return `${s.getDate()} - ${e.getDate()} ${MONTHS_AR[d.getMonth()]}`; }, step: d=>{ d.setDate(d.getDate()+7); } },
  monthly: { label: d => `${MONTHS_AR[d.getMonth()]} ${d.getFullYear()}`, step: d=>{ d.setMonth(d.getMonth()+1); } },
};

function setView(v) {
  state.view = v;
  ['daily','weekly','monthly'].forEach(x => {
    document.getElementById('tab-'+x).classList.toggle('active', x===v);
  });
  document.getElementById('dateNav').style.display = v==='daily' ? 'none' : '';
  saveState();
  render();
  updateDateLabel();
}

function navDate(dir) {
  const d = new Date(state.currentDate+'T00:00:00');
  const cfg = VIEWS_CONFIG[state.view];
  if (dir > 0) cfg.step(d);
  else { // reverse step
    if (state.view==='daily') d.setDate(d.getDate()-1);
    else if (state.view==='weekly') d.setDate(d.getDate()-7);
    else d.setMonth(d.getMonth()-1);
  }
  state.currentDate = fmtDate(d);
  saveState();
  updateDateLabel();
  render();
}

function updateDateLabel() {
  const d = new Date(state.currentDate+'T00:00:00');
  const cfg = VIEWS_CONFIG[state.view];
  const label = cfg.label(d);
  document.getElementById('headerDate').textContent = label;
  const dl = document.getElementById('dateLabel');
  if (dl) dl.textContent = label;
}

// ══════════════════════════ NOTIFICATIONS ════════════════════════════
var notifPermission = (typeof Notification !== 'undefined') ? Notification.permission : 'denied';

function requestNotifPermission() {
  if (typeof Notification === 'undefined') { alert('متصفحك لا يدعم الإشعارات. جرب افتح الملف من متصفح Chrome.'); return; }
  Notification.requestPermission().then(function(p) {
    notifPermission = p;
    render();
  });
}

function scheduleNotifications() {
  if (typeof Notification === 'undefined' || notifPermission !== 'granted') return;
  const now = new Date();
  state.tasks.forEach(task => {
    if (!task.notif || !task.time) return;
    const [h,m] = task.time.split(':').map(Number);
    const notifTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    const diff = notifTime - now;
    if (diff > 0 && diff < 86400000) {
      setTimeout(() => {
        if (notifPermission === 'granted') {
          new Notification('📋 ' + task.title, {
            body: task.notes || 'حان وقت المهمة!',
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📋</text></svg>'
          });
        }
      }, diff);
    }
  });
}

function toggleTaskDone(taskId) {
  var task = state.tasks.find(function(t){ return t.id === taskId; });
  if (!task) return;
  var dateObj = new Date(state.currentDate + 'T00:00:00');
  toggleDoneInPeriod(task, dateObj);
}

// ═══════════════════════════════ RENDER ══════════════════════════════
function render() {
  renderProfileStrip();
  renderContent();
  updateDateLabel();
}

function renderProfileStrip() {
  const strip = document.getElementById('profileStrip');
  if (state.profiles.length <= 1) { strip.style.display='none'; return; }
  strip.style.display = 'flex';
  strip.innerHTML = `<button class="profile-chip ${state.activeProfile==='all'?'active':''}" onclick="setProfile('all')">🌐 الكل</button>`
    + state.profiles.map(p =>
      `<button class="profile-chip ${state.activeProfile===p.id?'active':''}" onclick="setProfile('${p.id}')" style="${state.activeProfile===p.id?`border-color:${p.color};background:${p.color};`:''}">
        ${p.emoji} ${p.name}
      </button>`
    ).join('');
}

function setProfile(id) {
  state.activeProfile = id;
  saveState();
  render();
}

function renderContent() {
  const dateObj = new Date(state.currentDate + 'T00:00:00');
  const content = document.getElementById('content');
  const tasks = getVisibleTasks();
  const pending = tasks.filter(t => !isDoneInPeriod(t, dateObj));
  const done = tasks.filter(t => isDoneInPeriod(t, dateObj));
  const total = tasks.length;
  const pct = total ? Math.round((done.length/total)*100) : 0;

  // Update progress
  document.getElementById('progressLabel').textContent = `${pending.length} مهام متبقية`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = pct+'%';

  // Group by priority
  const groups = Object.entries(PRIORITY).map(([id,p]) => ({
    id, ...p, items: pending.filter(t => t.priority===id)
  })).filter(g => g.items.length > 0);

  let html = '';

  // Notif banner
  if (typeof Notification !== 'undefined' && notifPermission === 'default') {
    html += `<div class="notif-banner" onclick="requestNotifPermission()" style="margin-bottom:16px">
      🔔 <span>اضغط لتفعيل إشعارات المهام على جهازك</span>
    </div>`;
  }

  if (pending.length === 0 && done.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-icon">🎯</div>
      <div class="empty-title">لا توجد مهام</div>
      <div class="empty-sub">اضغط الزر بالأسفل لإضافة مهمتك الأولى</div>
    </div>`;
  } else {
    // Pending by priority
    groups.forEach(g => {
      const sorted = [...g.items].sort((a,b) => (a.time||'25:00').localeCompare(b.time||'25:00'));
      html += `<div class="priority-section">
        <div class="priority-header" style="background:${g.bg};color:${g.color}">
          <div class="priority-dot" style="background:${g.color}"></div>
          <span class="priority-name">${g.icon} ${g.label}</span>
          <span class="priority-count" style="color:${g.color}">${g.items.length}</span>
        </div>
        ${sorted.map(t => taskCardHTML(t, dateObj, false)).join('')}
      </div>`;
    });

    // Done
    if (done.length > 0) {
      html += `<div class="done-section">
        <button class="done-toggle" onclick="toggleDoneSection()">
          ✅ المنجزة (${done.length})
          <span style="margin-right:auto;font-size:16px" id="doneArrow">${state.showDone?'▲':'▼'}</span>
        </button>
        <div id="doneTasks" style="display:${state.showDone?'block':'none'}">
          ${done.map(t => taskCardHTML(t, dateObj, true)).join('')}
        </div>
      </div>`;
    }
  }

  content.innerHTML = html;
}

function toggleDoneSection() {
  state.showDone = !state.showDone;
  const dt = document.getElementById('doneTasks');
  const arr = document.getElementById('doneArrow');
  if (dt) dt.style.display = state.showDone ? 'block' : 'none';
  if (arr) arr.textContent = state.showDone ? '▲' : '▼';
}

function taskCardHTML(task, dateObj, isDone) {
  const p = PRIORITY[task.priority] || PRIORITY.medium;
  const profile = state.profiles.find(x => x.id === task.profileId);
  const typeLabel = TYPE_LABELS[task.recurType] || '';
  const timeLabel = task.time ? `🕐 ${task.time}` : '';
  const notifLabel = task.notif ? '🔔' : '';

  return `<div class="task-card ${isDone?'done':''}" style="border-right-color:${task.color||p.color};--before-bg:${task.color||p.color}">
    <button class="check-btn ${isDone?'checked':''}"
      onclick="toggleTaskDone('${task.id}')"
      style="border-color:${task.color||p.color};background:${isDone?(task.color||p.color):'transparent'}">
      ${isDone?'✓':''}
    </button>
    <div class="task-body">
      <div class="task-title">${escHtml(task.title)}</div>
      <div class="task-meta">
        <span class="tag" style="background:${p.bg};color:${p.color}">${p.icon} ${p.label}</span>
        ${typeLabel?`<span class="tag" style="background:var(--surface3);color:var(--text2)">🔄 ${typeLabel}</span>`:''}
        ${timeLabel?`<span class="tag" style="background:var(--surface3);color:var(--text2)">${timeLabel}</span>`:''}
        ${notifLabel?`<span class="tag" style="background:#fef3c7;color:#92400e">${notifLabel}</span>`:''}
        ${profile && state.profiles.length>1 ? `<span class="tag" style="background:${profile.color}18;color:${profile.color}">${profile.emoji} ${profile.name}</span>`:''}
      </div>
      ${task.notes?`<div style="font-size:12px;color:var(--text3);margin-top:5px;line-height:1.5">${escHtml(task.notes)}</div>`:''}
    </div>
    <div class="task-actions">
      <button class="task-act-btn edit" onclick="openEditModal('${task.id}')">✏️</button>
      <button class="task-act-btn del" onclick="deleteTask('${task.id}')">🗑</button>
    </div>
  </div>`;
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function deleteTask(id) {
  showConfirm('هل تريد حذف هذه المهمة؟', function() {
    state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
    if (state.doneLog) {
      Object.keys(state.doneLog).forEach(function(k){ if(k.indexOf(id+'_')===0) delete state.doneLog[k]; });
    }
    saveState();
    render();
  });
}

  var overlay = document.createElement('div');

  overlay.innerHTML = '<div style="background:var(--surface);border-radius:20px;padding:28px 24px;width:100%;max-width:320px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,0.3)">'
    + '<div style="font-size:36px;margin-bottom:12px">🗑️</div>'
    + '<div style="font-size:16px;font-weight:800;color:var(--text);margin-bottom:8px">حذف المهمة</div>'
    + '<div style="font-size:13px;color:var(--text2);margin-bottom:24px">'+msg+'</div>'
    + '<div style="display:flex;gap:10px">'
    + '<button id="confirmNo" style="flex:1;padding:12px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);color:var(--text2);font-family:Cairo,sans-serif;font-size:14px;font-weight:700;cursor:pointer">إلغاء</button>'
    + '<button id="confirmYes" style="flex:1;padding:12px;border-radius:12px;border:none;background:#ef4444;color:#fff;font-family:Cairo,sans-serif;font-size:14px;font-weight:800;cursor:pointer">حذف</button>'
    + '</div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#confirmYes').onclick = function(){ document.body.removeChild(overlay); onYes(); };
  overlay.querySelector('#confirmNo').onclick = function(){ document.body.removeChild(overlay); };
  overlay.onclick = function(e){ if(e.target===overlay) document.body.removeChild(overlay); };
}

function renderDateArea(f) {
  if (f.recurType==='once') {
    return `<div><label class="form-label">التاريخ</label><input class="form-input" type="date" id="f_date" value="${f.date||state.currentDate}"></div>`;

    return `<div><label class="form-label">يوم الأسبوع</label><select class="form-input" id="f_weekDay">
      ${DAYS_AR.map((d,i)=>`<option value="${i}" ${(f.weekDay||0)===i?'selected':''}>${d}</option>`).join('')}
    </select></div>`;
  }
  if (f.recurType==='monthly') {
    return `<div><label class="form-label">يوم من الشهر</label><select class="form-input" id="f_monthDay">

    </select></div>`;
  }
  return ''; // daily - no date needed
}

function setRecurType(v, btn) {
  const body = document.getElementById('modalBody');
  // Read current values before re-rendering
  const weekDayEl = document.getElementById('f_weekDay');
  const monthDayEl = document.getElementById('f_monthDay');
  const dateEl = document.getElementById('f_date');
  const f = {
    recurType: v,
    weekDay: weekDayEl ? +weekDayEl.value : +body.dataset.weekDay,
    monthDay: monthDayEl ? +monthDayEl.value : +body.dataset.monthDay,
    date: dateEl ? dateEl.value : body.dataset.date,
  };
  body.dataset.recurType = v;
  document.getElementById('f_dateArea').innerHTML = renderDateArea(f);
  // Update chip styles
  document.querySelectorAll('.chip').forEach(c => {
    if (c.getAttribute('onclick') && c.getAttribute('onclick').includes('setRecurType')) {
      const isThis = c.getAttribute('onclick').includes(`'${v}'`);
      c.classList.toggle('active', isThis);
    }
  });
}

function selectChip(groupId, val, btn) {
  const hidden = document.getElementById('f_profileId');
  if (hidden) hidden.value = val;
  document.querySelectorAll(`#${groupId} .chip`).forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
}

function selectColor(c, btn) {
  document.getElementById('f_color').value = c;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  btn.classList.add('selected');
}

function handleNotifToggle(el) {
  if (el.checked && notifPermission !== 'granted') {
    requestNotifPermission();
  }
}

function saveTask() {
  const title = document.getElementById('f_title').value.trim();
  if (!title) { document.getElementById('f_title').focus(); document.getElementById('f_title').style.borderColor='var(--critical)'; return; }

  const body = document.getElementById('modalBody');
  const recurType = body.dataset.recurType;
  const weekDayEl = document.getElementById('f_weekDay');
  const monthDayEl = document.getElementById('f_monthDay');
  const dateEl = document.getElementById('f_date');
  const profileIdEl = document.getElementById('f_profileId');

  const task = {
    id: editingTaskId || uid(),
    title,
    notes: document.getElementById('f_notes').value.trim(),
    priority: document.getElementById('f_priority').value,
    color: document.getElementById('f_color').value,
    recurType,
    date: dateEl ? dateEl.value : state.currentDate,
    weekDay: weekDayEl ? +weekDayEl.value : 0,
    monthDay: monthDayEl ? +monthDayEl.value : 1,
    time: document.getElementById('f_time').value,
    notif: document.getElementById('f_notif').checked,
    profileId: profileIdEl ? profileIdEl.value : 'me',
    createdAt: editingTaskId ? (state.tasks.find(t=>t.id===editingTaskId)?.createdAt||Date.now()) : Date.now(),
  };

  if (editingTaskId) {
    state.tasks = state.tasks.map(t => t.id===editingTaskId ? task : t);
  } else {
    state.tasks.push(task);
  }

  saveState();
  closeModal('taskModal');
  render();
  scheduleNotifications();
}

    </div>
    <input type="hidden" id="new_emoji" value="👤">
    <input class="form-input" id="new_name" placeholder="الاسم..." style="margin-bottom:10px">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      ${COLORS.slice(0,6).map(c=>`<button onclick="pickProfileColor('${c}',this)" style="width:28px;height:28px;border-radius:50%;background:${c};border:none;cursor:pointer"></button>`).join('')}
    </div>
    <input type="hidden" id="new_pcolor" value="#6366f1">
    <button onclick="addProfile()" style="width:100%;padding:12px;border-radius:14px;border:2px dashed var(--accent);background:var(--surface2);color:var(--accent);font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px">+ إضافة شخص</button>
  </div>
  `;
}

function pickEmoji(e, btn) {
  document.getElementById('new_emoji').value = e;
  document.querySelectorAll('#emoji_picker button').forEach(b => b.style.borderColor='var(--border)');
  btn.style.borderColor = 'var(--accent)';
}
function pickProfileColor(c, btn) {
  document.getElementById('new_pcolor').value = c;
  document.querySelectorAll('#profilesModalBody .color-btn').forEach(b => b.style.outline='none');
}
function addProfile() {
  const name = document.getElementById('new_name').value.trim();
  if (!name) return;
  const emoji = document.getElementById('new_emoji').value;
  const color = document.getElementById('new_pcolor').value;
  state.profiles.push({id:uid(),name,emoji,color});
  saveState();
  renderProfilesModal();
  renderProfileStrip();
}
function deleteProfile(id) {
  showConfirm('حذف هذا الشخص وإزالته من كل المهام؟', function() {
    state.profiles = state.profiles.filter(function(p){ return p.id !== id; });
    state.tasks.forEach(function(t){ if(t.profileId===id) t.profileId='me'; });
    if (state.activeProfile===id) state.activeProfile='all';
    saveState();
    renderProfilesModal();
    render();
  });
}

// ═══════════════════════════════ INIT ════════════════════════════════
loadState();
applyTheme();

// View init
document.getElementById('dateNav').style.display = state.view==='daily'?'none':'';
['daily','weekly','monthly'].forEach(v => document.getElementById('tab-'+v).classList.toggle('active',v===state.view));

render();
scheduleNotifications();
</script>
</body>
</html>
